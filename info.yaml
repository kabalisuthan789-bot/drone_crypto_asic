yaml_version: 6

project:
  title:        "ChaCha20 Hardware Crypto Accelerator"
  author:       "Abisri M"
  discord:      ""
  description:  "Area-optimized folded RFC 8439 ChaCha20 stream cipher engine with 8-bit multiplexed bus."
  language:     "Verilog"
  clock_hz:     50000000
  tiles:        "1x2"
  top_module:   "tt_um_chacha20"
  source_files:
    - "chacha_qr.v"
    - "chacha_core.v"
    - "chacha_stream_cipher.v"
    - "tt_um_chacha20.v"

documentation:
  author:       "Abisri M"
  title:        "ChaCha20 ASIC Top"
  language:     "Verilog"
  description:  "High-throughput symmetric cryptographic accelerator for secure telemetry."
  how_it_works: "A folded Quarter-Round state machine computes 80 iterations over 16 internal 32-bit registers."
  how_to_test:  "Shift 32 key bytes, 12 nonce bytes, and counter, pulse start, stream data through ui_in to uo_out."

pinout:
  ui[0]: "ui_in[0]"
  ui[1]: "ui_in[1]"
  ui[2]: "ui_in[2]"
  ui[3]: "ui_in[3]"
  ui[4]: "ui_in[4]"
  ui[5]: "ui_in[5]"
  ui[6]: "ui_in[6]"
  ui[7]: "ui_in[7]"

  uo[0]: "uo_out[0]"
  uo[1]: "uo_out[1]"
  uo[2]: "uo_out[2]"
  uo[3]: "uo_out[3]"
  uo[4]: "uo_out[4]"
  uo[5]: "uo_out[5]"
  uo[6]: "uo_out[6]"
  uo[7]: "uo_out[7]"

  uio[0]: "uio_in[0] (target sel 0)"
  uio[1]: "uio_in[1] (target sel 1)"
  uio[2]: "uio_in[2] (byte wr strobe)"
  uio[3]: "uio_in[3] (start trigger)"
  uio[4]: "uio_in[4] (stream valid in)"
  uio[5]: "uio_in[5] (stream last byte)"
  uio[6]: "uio_out[6] (core ready)"
  uio[7]: "uio_out[7] (stream valid out)"
